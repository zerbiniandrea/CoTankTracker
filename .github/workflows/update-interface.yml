name: Update WoW TOC Interface

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 2" # Tue 18:00 UTC — after US weekly maintenance
    - cron: "0 9 * * 3" # Wed 09:00 UTC — after EU weekly maintenance

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: toc
        uses: Nnoggie/wow-interface-updater@v1

      - uses: peter-evans/create-pull-request@v8
        if: steps.toc.outputs.changed == 'true'
        with:
          branch: automation/wow-interface
          delete-branch: true
          commit-message: "chore: 🔧 update WoW TOC interface versions"
          title: "chore: 🔧 update WoW TOC interface versions"
          body: ${{ steps.toc.outputs.pr-body }}
